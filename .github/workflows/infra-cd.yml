name: Infrastructure CD

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-cd.yml"

  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra-cd.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and policy checks
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned tooling
        run: |
          pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Infrastructure policy checks
        run: bash policy-check.sh

      - name: yamllint
        run: yamllint .

      - name: ansible-lint (production profile)
        run: ansible-lint

      - name: Syntax check (both environments)
        run: |
          for env in staging production; do
            ansible-playbook \
              -i "inventories/${env}/hosts.yml" \
              site.yml \
              --syntax-check
          done

  deploy-staging:
    name: Deploy to staging
    needs:
      - lint

    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - infra

    environment: staging

    concurrency:
      group: infra-deploy
      cancel-in-progress: false

    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure credential paths
        shell: bash
        run: |
          set -euo pipefail

          echo "ANSIBLE_PRIVATE_KEY_FILE=${RUNNER_TEMP}/deploy_key" >> "$GITHUB_ENV"
          echo "ANSIBLE_VAULT_PASSWORD_FILE=${HOME}/.vault/staging.pass" >> "$GITHUB_ENV"

      - name: Verify Vault password file
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$ANSIBLE_VAULT_PASSWORD_FILE" ]; then
            echo "::error::Ansible Vault password file not found."
            exit 1
          fi

          if [ ! -r "$ANSIBLE_VAULT_PASSWORD_FILE" ]; then
            echo "::error::Ansible Vault password file is not readable."
            exit 1
          fi

          if [ ! -s "$ANSIBLE_VAULT_PASSWORD_FILE" ]; then
            echo "::error::Ansible Vault password file is empty."
            exit 1
          fi

          echo "Vault password file exists and is readable."

      - name: Install pinned tooling
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "${RUNNER_TEMP}/venv"

          "${RUNNER_TEMP}/venv/bin/pip" install -r requirements.txt

          "${RUNNER_TEMP}/venv/bin/ansible-galaxy" \
            collection install -r requirements.yml

          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"

      - name: Write SSH private key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::GitHub Secret DEPLOY_SSH_KEY is empty or unavailable."
            exit 1
          fi

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ANSIBLE_PRIVATE_KEY_FILE"
          chmod 600 "$ANSIBLE_PRIVATE_KEY_FILE"

      - name: Apply configuration
        run: |
          ansible-playbook \
            -i inventories/staging/hosts.yml \
            site.yml \
            --diff

      - name: Idempotency check
        shell: bash
        run: |
          set -euo pipefail

          ansible-playbook \
            -i inventories/staging/hosts.yml \
            site.yml | tee second-run.log

          if grep -E '^\S+\s+: ok=[0-9]+\s+changed=[1-9]' second-run.log; then
            echo "::error::Second run changed something. Configuration is not idempotent."
            exit 1
          fi

      - name: Remove SSH private key
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/deploy_key"

  deploy-production:
    name: Deploy to production
    needs:
      - deploy-staging

    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - infra

    environment: production

    concurrency:
      group: infra-deploy
      cancel-in-progress: false

    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure credential paths
        shell: bash
        run: |
          set -euo pipefail

          echo "ANSIBLE_PRIVATE_KEY_FILE=${RUNNER_TEMP}/deploy_key" >> "$GITHUB_ENV"
          echo "ANSIBLE_VAULT_PASSWORD_FILE=${HOME}/.vault/production.pass" >> "$GITHUB_ENV"

      - name: Verify Vault password file
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$ANSIBLE_VAULT_PASSWORD_FILE" ]; then
            echo "::error::Ansible Vault password file not found."
            exit 1
          fi

          if [ ! -r "$ANSIBLE_VAULT_PASSWORD_FILE" ]; then
            echo "::error::Ansible Vault password file is not readable."
            exit 1
          fi

          if [ ! -s "$ANSIBLE_VAULT_PASSWORD_FILE" ]; then
            echo "::error::Ansible Vault password file is empty."
            exit 1
          fi

          echo "Vault password file exists and is readable."

      - name: Install pinned tooling
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "${RUNNER_TEMP}/venv"

          "${RUNNER_TEMP}/venv/bin/pip" install -r requirements.txt

          "${RUNNER_TEMP}/venv/bin/ansible-galaxy" \
            collection install -r requirements.yml

          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"

      - name: Write SSH private key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::GitHub Secret DEPLOY_SSH_KEY is empty or unavailable."
            exit 1
          fi

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ANSIBLE_PRIVATE_KEY_FILE"
          chmod 600 "$ANSIBLE_PRIVATE_KEY_FILE"

      - name: Apply configuration
        run: |
          ansible-playbook \
            -i inventories/production/hosts.yml \
            site.yml \
            --diff

      - name: Remove SSH private key
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/deploy_key"